name: Render AI news V5 cinematic test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/NewsV5.tsx'
      - 'src/v5-index.ts'
      - '.github/workflows/render-v5.yml'
permissions:
  contents: read
concurrency:
  group: v5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxkbcommon0 fonts-liberation libsndfile1
      - name: Install Remotion and offline neural speech tools
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check 'kokoro-onnx==0.6.1' 'soundfile>=0.12,<1' 'numpy>=2,<3'
          npx remotion browser ensure
      - name: Download Kokoro model on remote runner
        run: |
          mkdir -p models
          curl --fail --location --retry 3 --output models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl --fail --location --retry 3 --output models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s models/kokoro-v1.0.onnx)" -gt 100000000
      - name: Download licensed editorial photography (Pexels)
        run: |
          mkdir -p public/v5
          curl --fail -L --retry 3 -A 'Mozilla/5.0' --output public/v5/server.jpg 'https://images.pexels.com/photos/4508751/pexels-photo-4508751.jpeg?auto=compress&cs=tinysrgb&w=1400'
          curl --fail -L --retry 3 -A 'Mozilla/5.0' --output public/v5/business.jpg 'https://images.pexels.com/photos/9301879/pexels-photo-9301879.jpeg?auto=compress&cs=tinysrgb&w=1400'
          curl --fail -L --retry 3 -A 'Mozilla/5.0' --output public/v5/security.jpg 'https://images.pexels.com/photos/5408005/pexels-photo-5408005.jpeg?auto=compress&cs=tinysrgb&w=1400'
          curl --fail -L --retry 3 -A 'Mozilla/5.0' --output public/v5/network.jpg 'https://images.pexels.com/photos/5480781/pexels-photo-5480781.jpeg?auto=compress&cs=tinysrgb&w=1400'
          curl --fail -L --retry 3 -A 'Mozilla/5.0' --output public/v5/code.jpg 'https://images.pexels.com/photos/102061/pexels-photo-102061.jpeg?auto=compress&cs=tinysrgb&w=1400'
          for f in public/v5/*.jpg; do
            test "$(stat -c%s "$f")" -gt 30000 || exit 1
            identify "$f" || exit 1
          done
      - name: Generate exact V4 voice script and phrase timings
        run: python scripts/make-v4-voice.py
      - name: Verify voice and scene alignment
        run: python scripts/check-v4.py pre
      - name: Typecheck
        run: npm run typecheck
      - name: Render V5 full-HD vertical MP4
        run: |
          mkdir -p out
          npx remotion render src/v5-index.ts NewsV5 out/ai-news-v5.mp4 --codec h264 --crf 21 --concurrency 2
      - name: Extract QA stills across the video
        run: |
          for frame in 45 175 320 490 625 780 940 1100 1260; do
            npx remotion still src/v5-index.ts NewsV5 out/qa-$frame.png --frame "$frame"
          done
      - name: Verify MP4 and audio
        run: |
          test "$(stat -c%s out/ai-news-v5.mp4)" -gt 1000000
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json out/ai-news-v5.mp4 | tee out/video-info.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('out/video-info.json').read_text())
          assert any(s.get('width')==1080 and s.get('height')==1920 for s in j['streams'])
          assert any(s.get('codec_name')=='aac' for s in j['streams'])
          assert any(s.get('codec_name')=='h264' for s in j['streams'])
          print('V5 render verified',j['format']['duration'])
          PY
      - name: Upload MP4, stills, metadata
        uses: actions/upload-artifact@v4
        with:
          name: ai-tech-news-v5
          path: |
            out/ai-news-v5.mp4
            out/qa-*.png
            out/video-info.json
            src/v4-timing.json
          retention-days: 14
          if-no-files-found: error
